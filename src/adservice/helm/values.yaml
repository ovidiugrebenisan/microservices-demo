images:
  repository: 930385231819.dkr.ecr.eu-north-1.amazonaws.com/microservices-demo
  # Overrides the image tag whose default is the chart appVersion.
  tag: 1.0.0

serviceAccounts:
  create: true
  annotations: {}
  annotationsOnlyForCartservice: false

networkPolicies:
  create: false

sidecars:
  create: false

authorizationPolicies:
  create: false

securityContext:
  enable: false

adService:
  create: true
  name: adservice
  tag: "<+artifacts.primary.tag>" # keep the placeholder if you replace it later
  resources:
    requests:
      cpu: 200m
      memory: 180Mi
    limits:
      cpu: 300m
      memory: 300Mi
