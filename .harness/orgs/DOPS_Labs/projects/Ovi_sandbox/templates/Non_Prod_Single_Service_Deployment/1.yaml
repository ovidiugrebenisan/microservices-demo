template:
  name: Non Prod Single Service Deployment
  type: Pipeline
  projectIdentifier: Ovi_sandbox
  orgIdentifier: DOPS_Labs
  spec:
    stages:
      - stage:
          name: Deploy
          identifier: Deploy
          description: ""
          type: Deployment
          spec:
            deploymentType: NativeHelm
            service:
              serviceRef: <+input>
              serviceInputs: <+input>
            environment:
              environmentRef: DEV
              deployToAll: false
              infrastructureDefinitions:
                - identifier: devcluster
            execution:
              steps:
                - step:
                    name: Helm Deployment
                    identifier: helmDeployment
                    type: HelmDeploy
                    timeout: 10m
                    spec:
                      skipDryRun: false
                      ignoreReleaseHistFailStatus: false
              rollbackSteps:
                - step:
                    name: Helm Rollback
                    identifier: helmRollback
                    type: HelmRollback
                    timeout: 10m
                    spec: {}
          tags: {}
          failureStrategies:
            - onFailure:
                errors:
                  - AllErrors
                action:
                  type: StageRollback
    delegateSelectors:
      - dev
  identifier: Non_Prod_Single_Service_Deployment
  versionLabel: "1"
