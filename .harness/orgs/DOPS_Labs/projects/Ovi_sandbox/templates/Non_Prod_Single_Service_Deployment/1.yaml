template:
  name: Non Prod Single Service Deployment
  type: Pipeline
  projectIdentifier: Ovi_sandbox
  orgIdentifier: DOPS_Labs
  spec:
    stages:
      - stage:
          name: Deploy
          identifier: Deploy
          description: ""
          type: Deployment
          spec:
            deploymentType: NativeHelm
            service:
              serviceRef: <+input>
              serviceInputs: <+input>
            environment:
              environmentRef: DEV
              deployToAll: false
              infrastructureDefinitions:
                - identifier: devcluster
            execution:
              steps:
                - step:
                    name: Helm Deployment
                    identifier: helmDeployment
                    type: HelmDeploy
                    timeout: 10m
                    spec:
                      skipDryRun: false
                      ignoreReleaseHistFailStatus: false
              rollbackSteps:
                - step:
                    name: Helm Rollback
                    identifier: helmRollback
                    type: HelmRollback
                    timeout: 10m
                    spec: {}
          tags: {}
          failureStrategies:
            - onFailure:
                errors:
                  - AllErrors
                action:
                  type: StageRollback
      - stage:
          name: DAST
          identifier: DAST
          description: ""
          type: SecurityTests
          spec:
            cloneCodebase: false
            caching:
              enabled: false
              override: false
              paths: []
            buildIntelligence:
              enabled: false
            infrastructure:
              type: KubernetesDirect
              spec:
                connectorRef: DEV
                namespace: default
                automountServiceAccountToken: true
                nodeSelector:
                  beta.kubernetes.io/arch: amd64
                os: Linux
            execution:
              steps:
                - step:
                    type: Nikto
                    name: Nikto Scan
                    identifier: Nikto_Scan
                    spec:
                      mode: orchestration
                      config: default
                      target:
                        type: instance
                        detection: auto
                      advanced:
                        log:
                          level: debug
                        fail_on_severity: critical
                      instance:
                        domain: frontend
                        protocol: http
                        port: 80
                - step:
                    type: Zap
                    name: Zap Scan
                    identifier: Zap_Scan
                    spec:
                      mode: orchestration
                      config: default
                      target:
                        type: instance
                        detection: auto
                      advanced:
                        log:
                          level: debug
                        fail_on_severity: critical
                      resources:
                        limits:
                          memory: 2.7Gi
                          cpu: 1500m
                      instance:
                        domain: frontend
                        protocol: http
                        port: 80
    delegateSelectors:
      - dev
  identifier: Non_Prod_Single_Service_Deployment
  versionLabel: "1"
