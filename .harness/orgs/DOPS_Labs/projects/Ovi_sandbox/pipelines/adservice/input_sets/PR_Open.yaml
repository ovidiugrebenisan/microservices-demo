inputSet:
  name: PR Open
  identifier: PR_Open
  orgIdentifier: DOPS_Labs
  projectIdentifier: Ovi_sandbox
  pipeline:
    identifier: adservice
    template:
      templateInputs:
        properties:
          ci:
            codebase:
              build:
                type: PR
                spec:
                  number: <+trigger.prNumber>
        variables:
          - name: language
            type: String
            value: java
          - name: service_name
            type: String
            value: adservice
